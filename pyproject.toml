[project]
name = "lister"
version = "2.0.0"
description = "Photo-to-eBay listing pipeline: capture, identify, price, describe, export CSV."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13",
    "boto3>=1.40",
    "fastapi>=0.135",
    "httpx>=0.28",
    "jinja2>=3.1",
    "pillow>=12.0",
    "pillow-heif>=1.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lister = "lister.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lister*"]

[tool.setuptools.package-data]
lister = ["web/templates/*.html", "web/static/*", "roles/*.md", "templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
